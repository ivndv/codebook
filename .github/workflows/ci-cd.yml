name: codebook CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_Xq3HESm6PY1ec2LJXPuxVjvY
  VERCEL_PROJECT_ID: prj_BP5goHzxkiwlsUO3iaNiFPiWCeG5

jobs:
  lint:
    name: Lint & Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node y Bun
        uses: ./.github/actions/setup

      - name: Lint y formato
        run: bunx biome ci .

      - name: Tipos e i18n
        run: bun run typecheck

  build:
    name: Build
    needs: [lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node y Bun
        uses: ./.github/actions/setup

      - name: Descargar entorno de Vercel
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilar
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy:
    name: Deploy
    needs: [lint, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node y Bun
        uses: ./.github/actions/setup

      - name: Descargar entorno de Vercel
        run: bunx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compilar
        run: bunx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Desplegar
        run: bunx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
