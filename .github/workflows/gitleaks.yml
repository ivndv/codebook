name: gitleaks

# codebook no tiene CI propio: Vercel se encarga del deploy.
# Este workflow solo escanea secretos en los commits nuevos.

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  gitleaks:
    uses: ivndv/.github/.github/workflows/gitleaks.yml@main
